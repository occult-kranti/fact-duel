    <meta charset="utf-8" />

      name="description"

    <!-- The favicon, the two font preloads and the self-hosted fonts stylesheet are injected by the
         `fd-static-assets` plugin in vite.config.static.ts, which knows the deployment base path.
         That plugin also rewrites the description above, adds a canonical link and a no-script
         refresh, and puts a plain hand-off link inside #root, when APP_URL says the game has moved:
         this file describes the preview, and the preview only. The count in the description is the
         number of served expeditions (lib/expeditions.mjs ACTIVE_EXPEDITIONS) and is pinned by
         tests/offline-copy.test.mjs, so it cannot drift from what the build actually serves. -->

    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
