# The only scheduler this repository can declare — and it is best-effort, on purpose read that as
# UNRELIABLE. GitHub Actions `schedule:` events are queued on a shared pool: they run late by
# minutes and, at busy times (the top of the hour especially), by hours; runs can be dropped
# entirely under load; and the schedule is DISABLED automatically after 60 days with no commits to
# the repository. On top of that, a fork or a repo with Actions turned off never fires at all.
#
# THEREFORE: NO MONEY INVARIANT MAY DEPEND ON THIS WORKFLOW RUNNING.
#
# Anything that must be true is made true synchronously in the request that changes the world —
# settlement happens in the request that ends the room, holds are enforced opportunistically by the
# next request touching the account. This job is a backstop (bounded cleanup) plus a heartbeat: it
# writes an `ops_runs` row so that a sweep which stops happening becomes VISIBLE instead of looking
# exactly like a sweep with nothing to do. See docs/money-runbook.md.
#
# Why not a Cloudflare Cron Trigger: the deploy manifest is generated from .openai/hosting.json and
# the resulting dist/server/wrangler.json carries `triggers:{}`, `kv_namespaces:[]`, empty queues
# and `durable_objects:{bindings:[]}`. There is no wrangler.toml to add one to. If a triggers slot
# ever appears there, move the sweep to a real Cron Trigger — but do not design as if it will.
name: Hourly ops sweep

on:
  schedule:
    # Deliberately off the hour: :00 is the most contended minute on the shared scheduler.
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# A slow sweep must never have a second sweep started on top of it.
concurrency:
  group: ops-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Neither the secret nor the variable exists yet. A workflow that is permanently red teaches
      # everyone to ignore it, and an ignored alarm is worse than no alarm — so an unconfigured
      # deployment exits 0 and says what is missing, rather than failing.
      - name: Sweep
        env:
          OPS_TOKEN: ${{ secrets.OPS_TOKEN }}
          OPS_URL: ${{ vars.OPS_URL }}
        run: |
          set -uo pipefail

          if [ -z "${OPS_TOKEN:-}" ] || [ -z "${OPS_URL:-}" ]; then
            echo "Ops sweep is not configured yet — nothing to do."
            # Never interpolate the secret itself, not even masked — only whether it is there.
            if [ -n "${OPS_TOKEN:-}" ]; then token_state=present; else token_state=MISSING; fi
            echo "  secrets.OPS_TOKEN : ${token_state}"
            echo "  vars.OPS_URL      : ${OPS_URL:-MISSING}"
            echo
            echo "To enable: set the repository variable OPS_URL to the deployed /api/ops endpoint"
            echo "and the repository secret OPS_TOKEN to the same value as the worker's OPS_TOKEN."
            echo "Until both exist the route refuses every request with 503 and never falls open."
            exit 0
          fi

          call() {
            # Prints the HTTP status on stdout, leaves the body in response.json, never echoes the
            # token. Retries only connection-level failures; a 4xx/5xx answer is a real answer.
            curl --silent --show-error --location \
                 --max-time 60 --retry 2 --retry-connrefused \
                 --output response.json --write-out '%{http_code}' \
                 --request POST "${OPS_URL}" \
                 --header 'content-type: application/json' \
                 --header "authorization: Bearer ${OPS_TOKEN}" \
                 --data "$1"
          }

          status=$(call '{"action":"sweep"}') || {
            echo "Could not reach ${OPS_URL}."
            exit 1
          }
          echo "POST /api/ops {\"action\":\"sweep\"} -> HTTP ${status}"
          cat response.json || true
          echo

          case "${status}" in
            2??) ;;
            *)
              echo "::error::Ops sweep failed with HTTP ${status}. See docs/money-runbook.md."
              exit 1
              ;;
          esac

          # The ledger reconcile: replays every posted transaction through the invariants and
          # compares it with the cached balances. Drift is recorded and reported, never repaired.
          status=$(call '{"action":"reconcile"}') || status="000"
          echo "POST /api/ops {\"action\":\"reconcile\"} -> HTTP ${status}"
          cat response.json || true
          echo
          case "${status}" in
            2??) ;;
            *)
              echo "::error::Ledger reconcile failed with HTTP ${status}. See docs/money-runbook.md."
              exit 1
              ;;
          esac

          # Read the heartbeat back. Non-fatal: the sweep above already succeeded, and a health read
          # that cannot be taken is not itself a reason to page anyone at 3am.
          health=$(call '{"action":"health"}') || health="000"
          echo "POST /api/ops {\"action\":\"health\"} -> HTTP ${health}"
          cat response.json || true
          echo
