name: Deploy Jaanta Hai Kya server beta
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify source
        run: |
          pnpm exec tsc --noEmit
          node --test tests/*.test.mjs
      - name: Build server-connected browser app
        env:
          STATIC_BASE: /fact-duel/
          VITE_JHK_SERVER_URL: https://wvupsqfevlrmhqfjreyx.supabase.co/functions/v1/jhk-game
          APP_URL: ''
        run: |
          pnpm build:static
          node scripts/jhk-assemble-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-static
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
