# Publishes three things to GitHub Pages from one site:
#   /fact-duel/             the game, built as a fully offline single-page app (no server, no API)
#   /fact-duel/deck/        the seed investor deck
#   /fact-duel/compliance/  the operational compliance checklist for taking money
#
# The game normally runs on Cloudflare Workers with a D1-backed duel API. Pages is static only, so
# `pnpm build:static` swaps the duel client for an in-process implementation: bot duels, expeditions,
# discovery, the vault and the events calendar all work in the browser. Two-device friend duels
# genuinely need a server and are disabled there, which the build says on screen.
name: Deploy game, deck and compliance file to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Never cancel a half-finished deploy; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types and run the suite
        run: |
          pnpm exec tsc --noEmit
          node --test tests/*.test.mjs

      - name: Build the offline game
        env:
          STATIC_BASE: /fact-duel/
        run: pnpm build:static

      - name: Assemble the site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/deck _site/compliance
          cp -r dist-static/. _site/
          cp public/product/investor/deck.site.html _site/deck/index.html
          cp public/product/compliance/checklist.site.html _site/compliance/index.html
          cp -r public/product/investor/charts _site/deck/charts
          cp -r public/product/investor/shots _site/deck/shots
          cp public/product/investor/factduel-seed-deck.pptx _site/deck/factduel-seed-deck.pptx
          # Pages serves the artifact directly, but .nojekyll keeps any underscore-prefixed asset safe.
          touch _site/.nojekyll
          echo "Game entry:"; ls _site/index.html
          echo "Deck entry:"; ls _site/deck/index.html
          echo "Compliance entry:"; ls _site/compliance/index.html
          du -sh _site

      # Publish by committing the built site to the gh-pages branch. The Pages API route
      # (configure-pages / deploy-pages) needs a token that can create a Pages site, which the
      # workflow token is not permitted to do here; pushing a branch needs only contents: write.
      - name: Publish to the gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd _site
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish the game, the deck and the compliance file from ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
          echo "Published. Live once Pages source is set to the gh-pages branch:"
          echo "  game https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          echo "  deck https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/deck/"
          echo "  compliance https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/compliance/"
