<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
<title id="title">JHK Team Pavilion flow</title><desc id="desc">Solo play stays direct. Teams branches into create or join, shared home, fixtures and four-team tournaments. Captain settings remain optional.</desc>
